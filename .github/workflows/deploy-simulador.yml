name: Deploy Simulador via SSH

on:
  push:
    branches:
      - main
    paths:
      - 'simuladorportugal/**'

jobs:
  deploy-simulador:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "<LaTex>${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$</LaTex>{{ secrets.PORT }}" "<LaTex>${{ secrets.HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy simuladorportugal via rsync
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $</LaTex>{{ secrets.PORT }} -o StrictHostKeyChecking=no" \
            ./simuladorportugal/ "<LaTex>${{ secrets.USER }}@$</LaTex>{{ secrets.HOST }}:/home/${{ secrets.USER }}/domains/dpsimobiliario.pt/public_html/simuladorportugal/"
