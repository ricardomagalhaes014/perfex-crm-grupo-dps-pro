<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador do Investidor · Grupo DPS</title>
<meta name="description" content="Responda a algumas perguntas e descubra o imóvel em planta ideal para o seu investimento ou habitação.">
<style>
  :root{ --navy:#0D1F3C; --gold:#C5A55A; --bg:#f6f4ef; --ink:#1a1a1a; --muted:#6b6b6b; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--navy);color:#fff;padding:18px 20px;text-align:center;border-bottom:3px solid var(--gold)}
  header h1{font-size:1.15rem;font-weight:700;letter-spacing:.5px}
  header p{font-size:.8rem;color:#cbd5e1;margin-top:4px}
  main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:22px 16px 60px}
  .progress{height:6px;background:#e2ddd2;border-radius:3px;overflow:hidden;margin-bottom:26px}
  .progress > div{height:100%;background:var(--gold);width:0;transition:width .35s}
  .card{background:#fff;border:1px solid #e5e0d5;border-radius:14px;padding:26px 22px;box-shadow:0 4px 18px rgba(13,31,60,.06)}
  .pergunta{font-size:1.25rem;font-weight:700;color:var(--navy);margin-bottom:6px}
  .ajuda{font-size:.85rem;color:var(--muted);margin-bottom:18px}
  .opcoes{display:flex;flex-direction:column;gap:10px}
  .op{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid #e5e0d5;border-radius:11px;background:#fff;font-size:1rem;cursor:pointer;transition:border-color .15s, background .15s}
  .op:hover,.op:focus{border-color:var(--gold);background:#fdfaf3;outline:none}
  .op small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
  .campo-valor{display:flex;gap:10px;align-items:center;margin:8px 0 16px}
  .campo-valor input{flex:1;padding:14px 14px;font-size:1.2rem;border:2px solid #e5e0d5;border-radius:11px;width:100%}
  .campo-valor input:focus{border-color:var(--gold);outline:none}
  .botao{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:11px;padding:14px 26px;font-size:1rem;font-weight:600;cursor:pointer}
  .botao:hover{background:#16305a}
  .botao-ouro{background:var(--gold);color:var(--navy)}
  .botao-ouro:hover{background:#d4b76e}
  .voltar{background:none;border:0;color:var(--muted);font-size:.85rem;cursor:pointer;margin-top:18px;text-decoration:underline}
  .resultado-cabeca{margin-bottom:16px}
  .resultado-cabeca h2{color:var(--navy);font-size:1.3rem}
  .resultado-cabeca p{color:var(--muted);font-size:.9rem;margin-top:4px}
  .unidade{background:#fff;border:1px solid #e5e0d5;border-left:5px solid var(--gold);border-radius:12px;padding:16px 16px;margin-bottom:12px}
  .unidade.melhor{border:2px solid var(--gold);border-left-width:6px;background:#fffdf6}
  .etiqueta-melhor{display:inline-block;background:var(--gold);color:var(--navy);font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:8px;letter-spacing:.5px}
  .unidade h3{color:var(--navy);font-size:1.05rem}
  .unidade .sub{color:var(--muted);font-size:.82rem;margin:2px 0 10px}
  .linhas{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.88rem}
  .linhas b{color:var(--navy)}
  .preco-destaque{font-size:1.15rem;font-weight:700;color:var(--navy);margin-top:10px}
  .preco-destaque small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
  .plano{margin-top:12px;border-top:1px dashed #e5e0d5;padding-top:10px}
  .plano h4{font-size:.8rem;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
  .plano table{width:100%;border-collapse:collapse;font-size:.85rem}
  .plano td{padding:4px 0;border-bottom:1px solid #f2eee4}
  .plano td:last-child{text-align:right;font-weight:600;color:var(--navy);white-space:nowrap}
  .plano tr.total td{border-bottom:0;padding-top:7px;font-weight:700;color:var(--navy)}
  .cta-zona{margin-top:22px;display:flex;flex-direction:column;gap:10px}
  .cta-wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;padding:15px;border-radius:11px;font-weight:700;font-size:1rem}
  .aviso-credito{background:#fdf6e7;border:1px solid var(--gold);border-radius:11px;padding:14px 16px;font-size:.88rem;margin-bottom:14px}
  .sem-resultado{background:#fff;border:1px dashed #cbb;border-radius:12px;padding:20px;text-align:center;color:var(--muted);margin-bottom:12px}
  footer{background:var(--navy);color:#94a3b8;text-align:center;font-size:.72rem;padding:14px}
  .escondido{display:none}
  @media(max-width:480px){ .linhas{grid-template-columns:1fr} }
</style>
</head>

<footer>Grupo DPS · dpsimobiliario.pt · Simulação indicativa, sujeita a confirmação comercial</footer>

/* ======================================================================= */

function mesesAteEscritura(p){
  if (!p.escritura || p.escritura.indexOf('?') !== -1) { return 24; }
  var partes = p.escritura.split('-');
  var alvo = new Date(Number(partes[0]), Number(partes[1]) - 1, 1);
  return Math.max(0, Math.round((alvo - new Date()) / (30.44 * 24 * 3600 * 1000)));
}
function pctPlanta(p){
  return p.plano.filter(function(f){ return !f.escritura; }).reduce(function(s, f){ return s + f.pct; }, 0);
}
function escrituraTxt(p){
  if (!p.escritura || p.escritura.indexOf('?') !== -1) { return 'a confirmar'; }
  var m = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var partes = p.escritura.split('-');
  return m[Number(partes[1]) - 1] + ' ' + partes[0];
}

var unidades = [];
var respostas = {};
var historico = [];
var passoAtual = null;

function euro(v){ return v.toLocaleString('pt-PT', {style:'currency', currency:'EUR', maximumFractionDigits:0}); }
function tipBase(t){ var m = /T(\d)/.exec(t || ''); return m ? 'T' + m[1] : null; }
function indisponivel(estado){ return /vend|reserv|cpcv|bloq|indispon/i.test(String(estado || '')); }

function carregar(){
  var pUnits = fetch('units.json').then(function(r){ return r.json(); });
  var pStates = fetch('/simuladorportugal/save_states.php').then(function(r){ return r.json(); }).catch(function(){ return {}; });
  Promise.all([pUnits, pStates]).then(function(res){
    var catalogo = res[0], estados = res[1] || {};
    Object.keys(PROJETOS).forEach(function(pk){
      var mapa = {};
      (STATE_KEYS[pk] || []).forEach(function(k){ if (estados[k]) { Object.assign(mapa, estados[k]); } });
      Object.keys(estados).forEach(function(k){
        if (/_states$/.test(k) && k.replace(/_states$/, '').toLowerCase().indexOf(pk.slice(0, 4)) === 0) { Object.assign(mapa, estados[k]); }
      });
      var lista = catalogo[pk] || {};
      Object.keys(lista).forEach(function(fr){
        var u = lista[fr];
        var tb = tipBase(u.tipologia);
        if (!tb) { return; }
        if (!u.preco || u.preco <= 0) { return; }
        if (indisponivel(u.status)) { return; }        // estado do próprio catálogo (ex.: Gaia Premium)
        if (indisponivel(mapa[fr])) { return; }
        unidades.push({ projeto: pk, fraccao: fr, tipologia: u.tipologia, tip: tb,
          area: u.area, preco: u.preco, piso: u.piso, orientacao: u.orientacao, varanda: u.varanda });
      });
    });
    mostrarPasso('interesse');
  }).catch(function(){
    document.getElementById('ecra').innerHTML = 'Não foi possível carregar as oportunidades. Tente novamente mais tarde ou fale connosco no WhatsApp: <a href="https://wa.me/' + WHATSAPP + '">+351 925 610 864</a>.';
  });
}

/* ---------- passos ---------- */

var TOTAL_PASSOS = 6;

function mostrarPasso(id){
  passoAtual = id;
  var p = PASSOS[id];
  var el = document.getElementById('ecra');
  document.getElementById('barra').style.width = Math.min(95, Math.round((historico.length / TOTAL_PASSOS) * 100)) + '%';
  document.getElementById('btn-voltar').classList.toggle('escondido', historico.length === 0);
  var html = '<div class="pergunta">' + p.pergunta + '</div>';
  if (p.ajuda) { html += '<div class="ajuda">' + p.ajuda + '</div>'; }
  if (p.tipo === 'valor') {
    html += '<div class="campo-valor"><input id="inp-valor" type="text" inputmode="numeric" placeholder="Ex.: 50 000 €"></div>'
      + '<button class="botao" onclick="responderValor()">Continuar &rarr;</button>';
  } else {
    html += '<div class="opcoes">' + p.opcoes.map(function(o){
      return '<button class="op" onclick="responder(\'' + id + '\',' + JSON.stringify(String(o.v)).replace(/"/g, '&quot;') + ')"><strong>' + o.t + '</strong>' + (o.s ? '<small>' + o.s + '</small>' : '') + '</button>';
    }).join('') + '</div>';
  }
  el.innerHTML = html;
  if (p.tipo === 'valor') {
    var inp = document.getElementById('inp-valor');
    inp.addEventListener('input', function(){
      var n = this.value.replace(/[^\d]/g, '');
      this.value = n ? Number(n).toLocaleString('pt-PT') + ' €' : '';
    });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { responderValor(); } });
    inp.focus();
  }
  window.scrollTo(0, 0);
}

function responder(id, valor){
  respostas[id] = (valor !== '' && !isNaN(Number(valor))) ? Number(valor) : valor;
  historico.push(id);
  avancar(id);
}
function responderValor(){
  var n = Number((document.getElementById('inp-valor').value || '').replace(/[^\d]/g, ''));
  if (!n || n < 1000) { document.getElementById('inp-valor').style.borderColor = '#c0392b'; return; }
  respostas[passoAtual] = n;
  historico.push(passoAtual);
  avancar(passoAtual);
}
function avancar(id){
  var prox = PASSOS[id].proximo();
  if (prox) { mostrarPasso(prox); } else { mostrarResultado(); }
}
function voltar(){
  if (!historico.length) { return; }
  var ant = historico.pop();
  delete respostas[ant];
  mostrarPasso(ant);
}

/* ---------- filtragem, pontuação e proposta ---------- */
function custoPlanta(u){ return Math.round(u.preco * pctPlanta(PROJETOS[u.projeto])); }

function filtrar(){
  var i = respostas.interesse;
  var lista = unidades.slice();

  if (respostas.regiao && respostas.regiao !== 'indiferente') {
    lista = lista.filter(function(u){ return PROJETOS[u.projeto].regiao === respostas.regiao; });
  }
  if (respostas.tipologia && respostas.tipologia !== 'indiferente') {
    lista = lista.filter(function(u){ return u.tip === respostas.tipologia; });
  }

  if (i === 'habitacao') {
    var prazo = respostas.prazo_casa;
    lista = lista.filter(function(u){
      var pr = PROJETOS[u.projeto];
      if (prazo === 'agora')   { return pr.prontoAgora; }
      if (prazo === 'ate1ano') { return pr.prontoAgora || mesesAteEscritura(pr) <= 12; }
      return true;
    });
    var orc = respostas.valor_total || 0;
    lista.forEach(function(u){ u.custo = u.preco; u.custoLabel = 'Preço total'; });
    lista = lista.filter(function(u){ return u.preco <= orc * 1.05; });
  } else {
    var orc2 = (i === 'cedencia' ? respostas.valor_planta : respostas.valor_escritura) || 0;
    lista.forEach(function(u){
      u.custo = custoPlanta(u);
      u.custoLabel = 'Investimento até à escritura (' + Math.round(pctPlanta(PROJETOS[u.projeto]) * 100) + '%)';
    });
    lista = lista.filter(function(u){ return u.custo <= orc2 * 1.05; });
    if (i === 'cedencia') {
      var horizonte = Number(respostas.prazo_cedencia) || 6;
      lista = lista.filter(function(u){ return mesesAteEscritura(PROJETOS[u.projeto]) >= horizonte; });
    }
  }

  // pontuação: aproveitar o orçamento + preferências adicionais
  var pref = respostas.extras;
  lista.forEach(function(u){
    u.score = u.custo; // usar o orçamento ao máximo
    if (pref === 'varanda')   { u.score += (Number(u.varanda) || 0) * 3000; }
    if (pref === 'pisoalto')  { u.score += (Number(u.piso) || 0) * 2000; }
    if (pref === 'pisobaixo') { u.score -= (Number(u.piso) || 0) * 2000; }
  });
  lista.sort(function(a, b){ return b.score - a.score; });
  return lista;
}

function tabelaPlano(u){
  var pr = PROJETOS[u.projeto];
  var linhas = pr.plano.map(function(f){
    return '<tr><td>' + f.label + ' · ' + Math.round(f.pct * 100) + '%</td><td>' + euro(Math.round(u.preco * f.pct)) + '</td></tr>';
  }).join('');
  return '<div class="plano"><h4>Plano de pagamento' + (pr.confirmar ? ' (a confirmar pela DPS)' : '') + '</h4>'
    + '<table>' + linhas
    + '<tr class="total"><td>Até à escritura · ' + Math.round(pctPlanta(pr) * 100) + '%</td><td>' + euro(custoPlanta(u)) + '</td></tr>'
    + '</table></div>';
}

function cartaoUnidade(u, melhor){
  var pr = PROJETOS[u.projeto];
  return '<div class="unidade' + (melhor ? ' melhor' : '') + '">'
    + (melhor ? '<span class="etiqueta-melhor">SOLUÇÃO MAIS PRÓXIMA</span>' : '')
    + '<h3>' + pr.nome + ' · Fração ' + u.fraccao + '</h3>'
    + '<div class="sub">' + pr.local + (pr.prontoAgora ? ' · Pronto a habitar' : ' · Escritura prevista: ' + escrituraTxt(pr)) + '</div>'
    + '<div class="linhas">'
    + '<span><b>Tipologia:</b> ' + u.tipologia + '</span>'
    + '<span><b>Área:</b> ' + u.area + ' m²</span>'
    + '<span><b>Piso:</b> ' + u.piso + '</span>'
    + '<span><b>Orientação:</b> ' + (u.orientacao || '—') + '</span>'
    + (u.varanda ? '<span><b>Varanda:</b> ' + u.varanda + ' m²</span>' : '')
    + '</div>'
    + '<div class="preco-destaque">' + euro(u.preco) + '<small>' + u.custoLabel + ': ' + euro(u.custo) + '</small></div>'
    + (melhor ? tabelaPlano(u) : '')
    + '</div>';
}

function mostrarResultado(){
  var lista = filtrar();
  var el = document.getElementById('ecra');
  document.getElementById('barra').style.width = '100%';
  document.getElementById('btn-voltar').classList.remove('escondido');

  var interesseTxt = { habitacao:'Habitação própria', cedencia:'Investimento para cedência de posição', arrendamento:'Investimento para arrendamento' }[respostas.interesse];
  var querCredito = respostas.contacto_credito === 'sim' || respostas.contacto_credito2 === 'sim';

  var html = '<div class="resultado-cabeca"><h2>' + (lista.length ? 'Encontrámos ' + lista.length + ' oportunidade' + (lista.length > 1 ? 's' : '') + ' para si' : 'Resultado da simulação') + '</h2>'
    + '<p>' + interesseTxt
    + (respostas.regiao && respostas.regiao !== 'indiferente' ? ' · ' + respostas.regiao : '')
    + (respostas.tipologia && respostas.tipologia !== 'indiferente' ? ' · ' + respostas.tipologia : '') + '</p></div>';

  if (querCredito) {
    html += '<div class="aviso-credito"><b>DPS Crédito:</b> registámos o seu pedido — ao falar connosco, a equipa apresenta-lhe a melhor solução de financiamento.</div>';
  }

  var top = lista.slice(0, 5);
  if (top.length) {
    html += top.map(function(u, idx){ return cartaoUnidade(u, idx === 0); }).join('');
    if (lista.length > 5) { html += '<p class="ajuda" style="margin-top:6px">… e mais ' + (lista.length - 5) + ' unidades dentro dos seus critérios.</p>'; }
  } else {
    var proximas = unidades.slice();
    if (respostas.regiao && respostas.regiao !== 'indiferente') { proximas = proximas.filter(function(u){ return PROJETOS[u.projeto].regiao === respostas.regiao; }); }
    if (!proximas.length) { proximas = unidades.slice(); }
    if (respostas.tipologia && respostas.tipologia !== 'indiferente') {
      var mesmaTip = proximas.filter(function(u){ return u.tip === respostas.tipologia; });
      if (mesmaTip.length) { proximas = mesmaTip; }
    }
    proximas.forEach(function(u){
      u.custo = respostas.interesse === 'habitacao' ? u.preco : custoPlanta(u);
      u.custoLabel = respostas.interesse === 'habitacao' ? 'Preço total' : 'Investimento até à escritura (' + Math.round(pctPlanta(PROJETOS[u.projeto]) * 100) + '%)';
    });
    proximas.sort(function(a, b){ return a.custo - b.custo; });
    html += '<div class="sem-resultado">Não encontrámos unidades exatamente dentro dos seus critérios. Estas são as opções mais próximas:</div>';
    html += proximas.slice(0, 3).map(function(u, idx){ return cartaoUnidade(u, idx === 0); }).join('');
  }

  var msg = 'Olá! Fiz a simulação no Simulador do Investidor da DPS.\n'
    + 'Interesse: ' + interesseTxt + '\n'
    + (respostas.regiao && respostas.regiao !== 'indiferente' ? 'Região: ' + respostas.regiao + '\n' : '')
    + (respostas.tipologia && respostas.tipologia !== 'indiferente' ? 'Tipologia: ' + respostas.tipologia + '\n' : '')
    + (respostas.valor_total ? 'Valor disponível: ' + euro(respostas.valor_total) + '\n' : '')
    + (respostas.valor_planta ? 'Valor para investir em planta: ' + euro(respostas.valor_planta) + '\n' : '')
    + (respostas.valor_escritura ? 'Valor até à escritura: ' + euro(respostas.valor_escritura) + '\n' : '')
    + (top.length ? 'Sugestão: ' + PROJETOS[top[0].projeto].nome + ' fração ' + top[0].fraccao + ' (' + top[0].tipologia + ', ' + euro(top[0].preco) + ')\n' : '')
    + (querCredito ? 'Quero ser contactado pela DPS Crédito para solução de financiamento.\n' : '')
    + 'Gostava de saber mais.';

  html += '<div class="cta-zona">'
    + '<a class="cta-wa" href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">💬 Falar já com a DPS no WhatsApp</a>'
    + '<button class="botao botao-ouro" onclick="location.reload()">↻ Nova simulação</button>'
    + '</div>';

  el.innerHTML = html;
  window.scrollTo(0, 0);
}

carregar();
</script>
</body>
</html>
