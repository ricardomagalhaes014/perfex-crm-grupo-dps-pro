<script id="dps-fix-js">
(function() {
  var GOLD = '#C5A55A';

  function applyFix() {
    // Fix 1: Forcar cor clara nos containers azuis (badges, etc.)
    var els = document.querySelectorAll('[class*="bg-[#0D1F3C]"]');
    els.forEach(function(el) {
      el.style.color = 'rgba(245, 242, 237, 0.9)';
      var children = el.querySelectorAll('*');
      children.forEach(function(child) {
        if (!child.className || !child.className.includes('text-[#C5A55A]')) {
          child.style.color = 'rgba(245, 242, 237, 0.9)';
        }
      });
    });

    // Fix 2: Forcar textos do hero em dourado
    var heroSection = document.getElementById('hero');
    if (heroSection) {
      // "INVESTIMENTOS IMOBILIÁRIOS PREMIUM" - já tem text-[#C5A55A] mas pode ser sobrescrito
      var premiumEl = heroSection.querySelector('p[class*="tracking-"]');
      if (premiumEl) premiumEl.style.color = GOLD;

      // Título principal h1 - "Estruturamos investimento, não vendemos casas"
      var h1 = heroSection.querySelector('h1');
      if (h1) {
        h1.style.color = GOLD;
        // Garantir que todos os filhos também ficam dourados
        var h1children = h1.querySelectorAll('*');
        h1children.forEach(function(c) { c.style.color = GOLD; });
      }

      // Subtítulo p após h1
      var paras = heroSection.querySelectorAll('p');
      paras.forEach(function(p) {
        // Só o subtítulo (não o "INVESTIMENTOS...")
        if (p.className && p.className.includes('text-lg')) {
          p.style.color = 'rgba(197, 165, 90, 0.85)';
        }
      });
    }
  }

  document.addEventListener('DOMContentLoaded', applyFix);
  setTimeout(applyFix, 300);
  setTimeout(applyFix, 800);
  setTimeout(applyFix, 1500);
  var observer = new MutationObserver(function() { setTimeout(applyFix, 100); });
  document.addEventListener('DOMContentLoaded', function() {
    observer.observe(document.body, {childList: true, subtree: true});
  });
})();
</script>

<script id="dps-remove-form">
(function() {
  function removeContactForm() {
    var section = document.getElementById('contacto');
    if (!section) return;
    // Esconder o form
    var forms = section.querySelectorAll('form');
    forms.forEach(function(f) { f.style.display = 'none'; f.closest('[class]') && (f.closest('[class]').style.display = 'none'); });
    // Encontrar a coluna com o form (normalmente a primeira coluna do grid)
    var grid = section.querySelector('.grid');
    if (grid) {
      var cols = grid.children;
      if (cols.length >= 2) {
        // Esconder a coluna do formulario (col-span-3)
        for (var i = 0; i < cols.length; i++) {
          if (cols[i].querySelector('form')) {
            cols[i].style.display = 'none';
          }
        }
        // Expandir a coluna de contactos diretos
        grid.style.display = 'block';
      }
    }
  }
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(removeContactForm, 400);
    setTimeout(removeContactForm, 900);
    setTimeout(removeContactForm, 1800);
    setTimeout(removeContactForm, 3000);
  });
  var obs = new MutationObserver(function() { removeContactForm(); });
  document.addEventListener('DOMContentLoaded', function() {
    obs.observe(document.body, {childList: true, subtree: true});
  });
})();
</script>
